name: 🛠️ Add/Remove Labels

on:
  pull_request_target:
    types: [ opened, closed ]

jobs:
  merge_job:
    if: github.event.pull_request.merged == true
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          let removeLabelsList = [
            "Pending Merge", 
            "Needs Author Reply", 
            "Needs Review", 
            "Review High Priority", 
            "Needs Second Approval",
            "Blocked by dependency", 
            "Needs a new dev", 
            "squash-merge", 
            "Keep Open", 
            "Stable"
          ];

          async function removeLabel(label) {
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: label
            });
          }

          let result = await github.rest.issues.listLabelsOnIssue({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          if (result.data !== null && result.data.length > 0) {
            let labels = result.data;
            for (let label of labels) {
                if (removeLabelsList.includes(label.name)) {
                  console.log("Removed: ", label.name);
                  removeLabel(label.name);
                }
            }
          }

  add_new_contributor_label:
    if: github.event.action == 'opened'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const creator = context.payload.sender.login
            const opts = github.rest.issues.listForRepo.endpoint.merge({
              ...context.issue,
              creator,
              state: 'all'
            })
            const issues = await github.paginate(opts)
            for (const issue of issues) {
              if (issue.number === context.issue.number) {
                continue
              }
              if (issue.pull_request) {
                return // creator is already a contributor
              }
            }
            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['New contributor']
            })
  
  # Add 'Needs Review' label to newly opened, non-draft PRs
  add_needs_review_label:
    if: github.event.action == 'opened' && !github.event.pull_request.draft
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['Needs Review']
            })
